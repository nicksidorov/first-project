[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xemat"
version = "0.3.2"
description = "Совместная обработка бета-гамма спектров ксенона"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "PyQt5>=5.15.10,<5.16", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
xemat = "project:main"
xemat-cli = "xemat.cli:main"

[tool.setuptools]
packages = ["xemat"]
py-modules = ["project", "process_measurement", "ims_parser", "constants", "results_saver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
