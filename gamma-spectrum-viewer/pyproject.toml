[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-spectrum-viewer"
version = "0.2.0"
description = "Compact offline gamma spectrum viewer using only Tkinter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
gamma-spectrum-viewer = "spectrum_viewer:main"

[tool.setuptools]
py-modules = ["spectrum_viewer"]
